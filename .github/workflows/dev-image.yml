name: HolyArrsDev - Image

# Fork-only (AdmiralJunkie/HolyArrsDev). Builds the Docker image from
# deploy/Dockerfile for linux/amd64 (the TrueNAS host) and pushes it to
# ghcr.io/admiraljunkie/holyarrsdev on every push to a branch other than main.
#
# Tags:
#   :<branch>          the branch, with / turned into - (feature-jellyfin-signin)
#   :sha-<short sha>   this exact commit, for pinning HolyArrs-Dev
# The app's version is 1.3.6-dev.<short sha>, taken from the VERSION file.

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/admiraljunkie/holyarrsdev

jobs:
  image:
    name: Build and push the image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Name the tags
        id: names
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          short="$(git rev-parse --short=7 HEAD)"
          branch="$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-' | cut -c1-120)"
          base="$(tr -d '[:space:]' < VERSION)"
          {
            echo "short=$short"
            echo "branch=$branch"
            echo "version=$base-dev.$short"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Sign in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ steps.names.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.names.outputs.branch }}
            ${{ env.IMAGE }}:sha-${{ steps.names.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/AdmiralJunkie/HolyArrsDev
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,mode=max,scope=dev-image
